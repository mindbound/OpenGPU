name: Build and test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-and-test:
    # Pinned to a commit rather than @master (roadmap X-03). PARTIAL BY UPSTREAM'S DESIGN, and
    # worth knowing exactly how far it goes: this freezes the reusable workflow's own body, but
    # that workflow checks out its scripts repo at run time with no `ref:`, so the code it
    # actually executes still floats. Full closure would need a fork or vendoring, which is
    # disproportionate here.
    #
    # The real mitigation is that neither workflow forwards secrets any more — see
    # release-tags.yml, disarmed 2026-08-08 — so a compromised upstream has nothing to
    # exfiltrate. Revisit if this repository ever goes public or gains CI secrets.
    #
    # Bump deliberately, reading upstream's changelog:
    #   gh api repos/FalsePattern/fpgradle-workflows/commits/master --jq '.sha'
    uses: FalsePattern/fpgradle-workflows/.github/workflows/build-and-test.yml@aba382036ac3abcf6fa97dbe5cc8f518a640ec1c
    with:
      timeout: 90
      # `test` APPENDED 2026-08-12, and the omission was not cosmetic: this workflow is named
      # "build and test" and ran NEITHER `test` NOR `check`. Upstream runs
      # `./gradlew <workspace>` and then `./gradlew assemble`, and `assemble` builds jars without
      # touching the test task -- so the whole JUnit suite (446 tests, including the entire OCSL
      # conformance suite and the frozen golden vectors) executed only on developer machines and
      # had never once run in CI. Verified with `--dry-run`: `assemble` schedules no `:test`,
      # `setupCIWorkspace test` schedules `:compileTestJava`, `:testClasses`, `:test`.
      #
      # Two task names in one input rather than a second job, because upstream interpolates this
      # UNQUOTED into the gradle command line, and a separate job would repeat the whole RFG
      # workspace setup. That does couple us to the interpolation staying unquoted -- if a bump
      # ever quotes it, this silently becomes one bogus task name and the build fails loudly
      # rather than skipping, which is the right failure direction.
      workspace: setupCIWorkspace test
      client-only: false

  # The shipped Lua library, which is the mod's entire public interface, had NO automated
  # coverage in CI at all -- and `ingame/README.md` wrongly claimed otherwise for a while. Three
  # font defects reached a play-test partly because of that.
  #
  # A SEPARATE JOB rather than a Gradle task wired into `check`, and the reason matters. The job
  # above delegates its whole body to the upstream reusable workflow; we contribute no steps to
  # it, so we cannot install anything into it. A `check`-attached Gradle Exec task would
  # therefore have to be guarded on a `lua` binary that ubuntu-latest does not ship -- and would
  # then skip silently on every CI run, which is precisely the "coverage that never runs" this
  # exists to fix. Installing the interpreters in a job we own is the only shape that actually
  # executes.
  #
  # BOTH interpreters, because OpenComputers supports 5.3 and 5.4 and OpenOS runs 5.3, so the
  # version the library actually meets in game is the older one. lua-packcheck exercises the
  # Lua-5.2 double packer, which is dead code in game and testable only here.
  #
  # All three harnesses exit non-zero on failure (verified), so this job genuinely fails rather
  # than printing FAIL and passing.
  lua-harnesses:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, consistent with X-03's discipline for the reusable workflow above.
      # v4 resolved to this SHA on 2026-08-08; bump deliberately, not by drifting a tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Lua 5.3 and 5.4
        # apt rather than a setup-lua action: one less third-party action in the supply chain,
        # for a dependency this trivial.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.3 lua5.4

      - name: Run the Lua harnesses under both interpreters
        run: |
          set -euo pipefail
          for interp in lua5.3 lua5.4; do
            echo "::group::$interp"
            "$interp" -v
            for harness in tools/lua-smoke.lua tools/lua-packcheck.lua tools/lua-globals.lua; do
              echo "--- $harness"
              "$interp" "$harness"
            done
            echo "::endgroup::"
          done
